repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c]
        # Data tables written by tools/, kept exactly as generated.
        exclude: _table\.h$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 0.29.2
    hooks:
      - id: gersemi

  # Every source file of Ernie's own starts with its license line.
  - repo: local
    hooks:
      - id: spdx-license
        name: SPDX license line
        language: pygrep
        entry: "SPDX-License-Identifier: BSD-3-Clause"
        args: [--negate]
        files: (\.(cpp|h|slang|py|cmake|sh)|(^|/)CMakeLists\.txt)$
