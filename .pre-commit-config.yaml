repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.patch$
      - id: end-of-file-fixer
        exclude: \.patch$
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
        args: [--unsafe]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c]

  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 0.29.2
    hooks:
      - id: gersemi

  - repo: local
    hooks:
      - id: spdx-license
        name: SPDX license line
        language: pygrep
        entry: "SPDX-License-Identifier: BSD-3-Clause"
        args: [--negate]
        files: (\.(cpp|h|slang|py|cmake|sh)|(^|/)CMakeLists\.txt)$
