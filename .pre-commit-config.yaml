# Vendored code in third_party/ directories stays byte-identical to upstream.
exclude: (^|/)third_party/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]
        exclude: (^|/)third_party/

  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: cppcheck
        exclude: (^|/)third_party/
        additional_dependencies: ["cppcheck==1.5.1"]
        args:
          - "--language=c++"
          - "--std=c++20"
          - "--enable=warning,performance,portability"
          - "--suppress=missingInclude"
          - "--suppress=normalCheckLevelMaxBranches"
          - "--error-exitcode=1"

  # Every source file of Ernie's own starts with its license: `// SPDX-License-Identifier:
  # BSD-3-Clause` (C++, Slang) or `# ...` (Python, CMake).
  - repo: local
    hooks:
      - id: spdx-license
        name: SPDX license line
        language: pygrep
        entry: "SPDX-License-Identifier: BSD-3-Clause"
        args: [--negate]
        files: (\.(cpp|h|slang|py|cmake)|\.cmake\.in|(^|/)CMakeLists\.txt)$

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        additional_dependencies: ["pyyaml>=5.1"]
