site_name: Ernie
site_description: Efficient Renderer for Natural and Interplanetary Environments
site_url: https://alexmaietta.github.io/ernie/
repo_url: https://github.com/alexmaietta/ernie
repo_name: alexmaietta/ernie
edit_uri: blob/main/docs/
docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  Makefile
  README.md
  requirements.txt

theme:
  name: readthedocs
  # The API pages' classes and functions listed in the sidebar under their page.
  navigation_depth: 3
  collapse_navigation: true
  sticky_navigation: true

extra_css:
  - css/extra.css

# The sidebar scrolls to the current page's entry without moving the page (js/sidebar.js).
extra_javascript:
  - js/sidebar.js

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Viewer: getting-started/viewer.md
      - Demos: getting-started/demos.md
  - Concepts:
      - Scene description: concepts/scene.md
      - Transforms: concepts/transforms.md
      - Spectral rendering: concepts/spectral.md
      - Lighting: concepts/lighting.md
      - Cameras and lenses: concepts/cameras.md
      - Sensor filters: concepts/sensor-filters.md
      - Materials and BRDFs: concepts/materials.md
      - Shadows: concepts/shadows.md
      - Terrain and planets: concepts/terrain.md
      - Star fields: concepts/star-fields.md
      - Volumes: concepts/volumes.md
  - Extending Ernie:
      - Overview: extending/index.md
      - Materials:
          - Custom BRDFs: extending/custom-brdfs.md
      - Cameras and sensors:
          - Custom sensor filters: extending/custom-sensor-filters.md
          - Custom AOVs: extending/custom-aovs.md
          - Custom lenses: extending/custom-lenses.md
      - Light and sky:
          - Custom spectra: extending/custom-spectra.md
          - Custom star catalogs: extending/custom-star-catalogs.md
      - Viewer:
          - Custom panels and menus: extending/custom-panels.md
          - Frame callbacks: extending/frame-callbacks.md
          - Debug drawing and overlays: extending/debug-draw.md
      - Rendering:
          - Custom render delegates: extending/custom-render-delegates.md
  - Guides:
      - Describing scenes: guides/scenes.md
      - Importing USD: guides/usd-import.md
      - Columns: guides/columns.md
      - Batched rendering for RL: guides/batched-rendering.md
      - GPU interop: guides/gpu-interop.md
  - API reference:
      - Python:
          - Scene: api/python/scene.md
          - Prim types: api/python/schemas.md
          - Rendering: api/python/rendering.md
          - Cameras and sensor models: api/python/cameras.md
          - Astronomy: api/python/astronomy.md
          - Batched cameras: api/python/batch.md
          - Viewer: api/python/app.md
          - Demos: api/python/demo.md
          - Tokens: api/python/tokens.md
      - C++:
          - Overview: api/cpp.md
          - Classes: cpp/annotated.md
          - Class hierarchy: cpp/hierarchy.md
          - Functions: cpp/namespace_member_functions.md
          - Namespace ernie: cpp/namespaceernie.md
          - Files: cpp/files.md

plugins:
  - search
  # Versions on GitHub Pages (CI deploys "latest" from main), with a selector between them.
  - mike:
      version_selector: true
      canonical_version: latest
  - mkdoxy:
      projects:
        cpp:
          # The public API's headers: device/ for the types the others take; raster/ and kernel/
          # are internal (cmake/ErnieInstall.cmake installs the same).
          src-dirs: ernie/scene ernie/session ernie/app ernie/geometry ernie/util ernie/device
          full-doc: true
          doxy-cfg:
            FILE_PATTERNS: "*.h"
            RECURSIVE: true
            EXTRACT_ALL: true
            JAVADOC_AUTOBRIEF: true
            # Includes as users write them: "ernie/scene/scene.h".
            FULL_PATH_NAMES: true
            STRIP_FROM_PATH: .
            STRIP_FROM_INC_PATH: .
      save-api: .mkdoxy
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # The built package: the module's stubs (nanobind's stubgen) beside its Python files.
          paths: [build/python]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            # Each page's classes and functions as level-2 headings (the sidebar lists them), and
            # their members below, each class opening with a table of them.
            heading_level: 2
            members_order: alphabetical
            group_by_category: true
            show_category_heading: false
            summary: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 88
            merge_init_into_class: true
            show_if_no_docstring: true
            show_bases: true
