site_name: Ernie
site_description: Efficient Renderer for Natural and Interplanetary Environments
site_url: https://alexmaietta.github.io/ernie/
repo_url: https://github.com/alexmaietta/ernie
repo_name: alexmaietta/ernie
edit_uri: blob/main/docs/
docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  Makefile
  README.md
  requirements.txt

theme:
  name: readthedocs
  navigation_depth: 3
  collapse_navigation: true
  sticky_navigation: true

extra_css:
  - css/extra.css

extra_javascript:
  - js/sidebar.js

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Viewer: getting-started/viewer.md
      - Demos: getting-started/demos.md
  - API reference:
      - Python:
          - Scene: api/python/scene.md
          - Prim types: api/python/schemas.md
          - Rendering: api/python/rendering.md
          - Cameras and sensor models: api/python/cameras.md
          - Astronomy: api/python/astronomy.md
          - Batched cameras: api/python/batch.md
          - Viewer: api/python/app.md
          - Demos: api/python/demo.md
          - Tokens: api/python/tokens.md
      - C++:
          - Overview: api/cpp.md
          - Classes: cpp/annotated.md
          - Class hierarchy: cpp/hierarchy.md
          - Functions: cpp/namespace_member_functions.md
          - Namespace ernie: cpp/namespaceernie.md
          - Files: cpp/files.md

plugins:
  - search
  - mike:
      version_selector: true
      canonical_version: latest
  - mkdoxy:
      projects:
        cpp:
          src-dirs: ernie/scene ernie/session ernie/app ernie/geometry ernie/util ernie/device
          full-doc: true
          doxy-cfg:
            FILE_PATTERNS: "*.h"
            RECURSIVE: true
            EXTRACT_ALL: true
            JAVADOC_AUTOBRIEF: true
            FULL_PATH_NAMES: true
            STRIP_FROM_PATH: .
            STRIP_FROM_INC_PATH: .
      save-api: .mkdoxy
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [build/python]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: alphabetical
            group_by_category: true
            show_category_heading: false
            summary: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 88
            merge_init_into_class: true
            show_if_no_docstring: true
            show_bases: true
