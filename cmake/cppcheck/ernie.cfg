<!-- SPDX-License-Identifier: BSD-3-Clause -->
<!-- Macros cppcheck cannot see through on its own (pre-commit's cppcheck hook loads this):
     Ernie's reflected schema macros (ernie/scene/prim_type.h), which expand to class bodies and
     definitions, and nanobind's type caster macro. -->
<def format="2">
  <define name="ERNIE_SCHEMA_BODY(Class, Base, ATTRIBUTES)" value="public:"/>
  <define name="ERNIE_SCHEMA_DEFINE(Class)" value=""/>
  <define name="ERNIE_DEFINE_SCHEMA(Class, typeName, base, isAbstract, typeDoc, OWN_ATTRIBUTES)" value=""/>
  <define name="ERNIE_DEFINE_OPEN_SCHEMA(Class, typeName, base, isAbstract, typeDoc, OWN_ATTRIBUTES, ...)" value=""/>
  <define name="NB_TYPE_CASTER(Value_, descr)" value="Value_ value;"/>
  <!-- OpenUSD's namespace directive (ernie/usd/usd_plugin.cpp). -->
  <define name="PXR_NAMESPACE_USING_DIRECTIVE" value=""/>
</def>
