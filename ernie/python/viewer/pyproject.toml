[build-system]
requires = ["scikit-build-core>=1.1", "nanobind>=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "ernie-renderer-viewer"
dynamic = ["version", "dependencies"]
description = "The Ernie viewer, for ernie-renderer"
readme = { text = "The interactive viewer for [ernie-renderer](https://pypi.org/project/ernie-renderer/). Install it with `pip install \"ernie-renderer[viewer]\"`, then open it with `ernie-viewer` or `ernie.viewer.Viewer` from Python.", content-type = "text/markdown" }
license = "BSD-3-Clause"
authors = [{ name = "Alex Maietta" }]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/alexmaietta/ernie"
Documentation = "https://alexmaietta.github.io/ernie/"
Repository = "https://github.com/alexmaietta/ernie"
Issues = "https://github.com/alexmaietta/ernie/issues"

[project.scripts]
ernie-viewer = "ernie.viewer:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
cmake.build-type = "Release"
cmake.source-dir = "../../.."
build-dir = "../../../build-wheel/viewer"
wheel.py-api = "cp312"
wheel.packages = []
build.targets = ["_viewer", "ernie_python_stubs_viewer"]
install.components = ["viewer_python"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "../../../CMakeLists.txt"
regex = '''project\(\s*Ernie\s+VERSION\s+(?P<value>[0-9]+\.[0-9]+\.[0-9]+)'''

[tool.scikit-build.metadata.dependencies]
provider = "scikit_build_core.metadata.template"
result = ["ernie-renderer=={project[version]}", "numpy>=1.24"]

[tool.scikit-build.cmake.define]
ERNIE_BUILD_PYTHON = "ON"
ERNIE_BUILD_VIEWER = "ON"
ERNIE_BUILD_TESTS = "OFF"
ERNIE_INSTALL = "ON"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"
skip = "*-musllinux_*"
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"

[tool.cibuildwheel.linux]
before-all = "dnf install -y libX11-devel libXrandr-devel libXinerama-devel libXcursor-devel libXi-devel wayland-devel libxkbcommon-devel"
repair-wheel-command = "auditwheel repair --exclude 'libernie.so*' --exclude 'libslang-*' --exclude 'libvulkan.so*' -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "26.0" }
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} --exclude libernie --exclude libslang --ignore-missing-dependencies -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
archs = ["native"]
repair-wheel-command = "delvewheel repair --no-dll \"ernie.dll;ernie_viewer.dll;slang-compiler.dll;slang-glslang.dll;msvcp140.dll\" -w {dest_dir} {wheel}"
