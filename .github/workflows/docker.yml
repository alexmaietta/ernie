name: Docker

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build --target dev -t ernie:test .
      - name: Smoke test
        run: >
          docker run --rm -e LP_NUM_THREADS=1 -v "$PWD/tests/consumer:/consumer:ro" ernie:test
          sh -c "cmake -S /consumer -B /tmp/consumer -G Ninja -DCMAKE_BUILD_TYPE=Release
          && cmake --build /tmp/consumer && ctest --test-dir /tmp/consumer --output-on-failure"
      - name: Push
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          version=${GITHUB_REF_NAME#v}
          for tag in "$version" "${version%.*}" latest; do
            docker tag ernie:test "$image:$tag"
            docker push "$image:$tag"
          done
