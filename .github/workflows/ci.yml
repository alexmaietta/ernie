name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_GENERATOR: Ninja

jobs:
  # The version's pre-release suffix (ERNIE_VERSION_SUFFIX in CMakeLists.txt), which the wheel,
  # sdist and package jobs write into their checkout: ".devN" on pushes to main, N the commits since
  # the last release tag; none on release tags (vX.Y.Z, which must match CMakeLists.txt's version)
  # or pull requests. After a release, main must move to the next version before its dev builds.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suffix: ${{ steps.version.outputs.suffix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          project=$(grep -m 1 -oP '^\s*VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          suffix=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$project" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match CMakeLists.txt's version $project"
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if git rev-parse -q --verify "refs/tags/v$project" >/dev/null; then
              echo "::error::v$project is released; move CMakeLists.txt to the next version"
              exit 1
            fi
            if last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null); then
              suffix=".dev$(git rev-list --count "$last..HEAD")"
            else
              suffix=".dev$(git rev-list --count HEAD)"
            fi
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "Version $project$suffix"

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # mypy checks the built package, so the test job runs it after the build.
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: mypy

  # Ernie built from source and tested on lavapipe under the Vulkan validation layer. GCC, on the
  # oldest supported Python, runs every test (C++, GPU, Python, the install test and the README's
  # examples) in four parts of every fourth test each (ctest -I part,,4), so the slow GPU tests run
  # side by side; Clang, on the newest Python, runs the unit and Python tests. Tests fail on any
  # validation message, and on a missing driver or layer rather than skipping
  # (ERNIE_TEST_REQUIRE_VALIDATION). Windows (MSVC) runs the unit tests and the GPU tests on
  # Mesa's lavapipe, without the validation layers; macOS (Apple Clang, MoltenVK), with no Vulkan
  # driver on its runners, the unit tests. Both build through sccache.
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 75 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc, part 1 of 4
            key: gcc-1
            cc: gcc
            cxx: g++
            python: "3.12"
            tests: -I 1,,4
          - name: gcc, part 2 of 4
            key: gcc-2
            cc: gcc
            cxx: g++
            python: "3.12"
            tests: -I 2,,4
          - name: gcc, part 3 of 4
            key: gcc-3
            cc: gcc
            cxx: g++
            python: "3.12"
            tests: -I 3,,4
          - name: gcc, part 4 of 4
            key: gcc-4
            cc: gcc
            cxx: g++
            python: "3.12"
            tests: -I 4,,4
          - name: clang, Python 3.14, unit and Python tests
            key: clang
            cc: clang
            cxx: clang++
            python: "3.14"
            tests: -L "unit|python"
          - name: windows-2025, part 1 of 2
            os: windows-2025
            key: windows-1
            cc: cl
            cxx: cl
            python: "3.12"
            tests: -L "unit|gpu" --timeout 600 -I 1,,2
            validation: "0"
          - name: windows-2025, part 2 of 2
            os: windows-2025
            key: windows-2
            cc: cl
            cxx: cl
            python: "3.12"
            tests: -L "unit|gpu" --timeout 600 -I 2,,2
            validation: "0"
          - name: macos-15, unit tests
            os: macos-15
            key: macos
            cc: clang
            cxx: clang++
            python: "3.12"
            tests: -L unit
            validation: "0"
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ERNIE_TEST_REQUIRE_VALIDATION: ${{ matrix.validation || '1' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Vulkan (lavapipe, validation layers) and the app's window system headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build mesa-vulkan-drivers vulkan-validationlayers \
            libvulkan1 xvfb libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev
      - uses: astral-sh/setup-uv@v7
        if: runner.os == 'Linux'
      - name: Python environment
        if: runner.os == 'Linux'
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install numpy pytest pillow nanobind mypy
      # Windows and macOS: the module's build needs, without the Python tests.
      - uses: actions/setup-python@v7
        if: runner.os != 'Linux'
        with:
          python-version: ${{ matrix.python }}
      - name: Python packages
        if: runner.os != 'Linux'
        run: python -m pip install nanobind numpy
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja
      # A compiler cache: ccache on Linux, sccache (which caches MSVC too) elsewhere.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ${{ runner.os == 'Linux' && 'ccache' || 'sccache' }}
          key: ${{ runner.os == 'Linux' && format('test-{0}', matrix.cc) || format('build-{0}', matrix.os) }}
      # The fetched dependencies' sources (Slang alone is hundreds of MB), keyed on their pins.
      - uses: actions/cache@v6
        with:
          path: |
            .deps/*-src
            .deps/*-subbuild
          key: deps-${{ runner.os != 'Linux' && format('{0}-', runner.os) || '' }}${{ hashFiles('cmake/third_party/**') }}
      - name: Configure
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "-DFETCHCONTENT_BASE_DIR=$PWD/.deps"
          -DERNIE_BUILD_TESTS=ON -DERNIE_BUILD_DEMOS=ON -DERNIE_INSTALL=ON
          -DERNIE_BUILD_PYTHON=ON -DERNIE_BUILD_APP=ON
          "-DPython_EXECUTABLE=$PWD/.venv/bin/python"
      # Windows with debug information for the debugger below, in the
      # objects (/Z7), which sccache caches as it cannot /Zi's PDBs.
      - name: Configure
        if: runner.os != 'Linux'
        shell: bash
        run: >
          cmake -S . -B build
          ${{ runner.os == 'Windows' && '-DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded' || '-DCMAKE_BUILD_TYPE=Release' }}
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          "-DFETCHCONTENT_BASE_DIR=$PWD/.deps"
          -DERNIE_BUILD_TESTS=ON -DERNIE_BUILD_DEMOS=ON -DERNIE_BUILD_PYTHON=ON -DERNIE_BUILD_APP=ON
      - name: Build
        shell: bash
        run: cmake --build build --parallel 4
      # The package as built, with its stubs, and the demos ([tool.mypy]): pre-commit's mypy hook
      # needs a build, so the format job skips it.
      - name: Type check
        if: matrix.key == 'clang'
        run: .venv/bin/mypy
      # For the CI metrics (ci-metrics.yml): every compile's and link's time, and ccache's hits.
      - name: Compiler cache statistics
        if: always() && runner.os == 'Linux'
        run: ccache --print-stats > build/ccache-stats.tsv || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ninja-log-test-${{ matrix.key }}
          path: |
            build/.ninja_log
            build/ccache-stats.tsv
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      # The data the demos fetch (LOLA's terrain and the like) into their
      # cache, kept between runs rather than downloaded by each.
      - uses: actions/cache@v6
        if: runner.os == 'Linux'
        with:
          path: ~/.cache/ernie
          key: demo-data-${{ hashFiles('demos/**') }}
          restore-keys: demo-data-
      - name: Test on lavapipe
        if: runner.os == 'Linux'
        run: |
          VK_DRIVER_FILES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n1)
          export VK_DRIVER_FILES VK_ICD_FILENAMES=$VK_DRIVER_FILES
          xvfb-run -a ctest --test-dir build --output-on-failure -j4 --timeout 1800 ${{ matrix.tests }}
      - name: Install Vulkan (lavapipe, Vulkan loader)
        if: runner.os == 'Windows'
        shell: bash
        run: .github/scripts/install-lavapipe-windows.sh
      - name: Test
        if: runner.os != 'Linux'
        shell: bash
        run: ctest --test-dir build --output-on-failure -j4 ${{ matrix.tests }}
      # A failing Windows test is run again under the debugger, which prints where it failed.
      # ctest names a test "ernie_<suite>.<gtest name>", from the program ernie_tests_<suite>.
      - name: Debug the first failing test
        if: failure() && runner.os == 'Windows'
        shell: bash
        run: |
          name=$(sed -n '1s/^[0-9]*://p' build/Testing/Temporary/LastTestsFailed.log)
          suite=${name%%.*}
          .github/scripts/debug-windows.sh build/bin \
            "build/bin/ernie_tests_${suite#ernie_}.exe" "--gtest_filter=${name#*.}"

  # The C++ tests built with AddressSanitizer and UndefinedBehaviorSanitizer: the unit tests, and the
  # GPU tests on lavapipe (Mesa's own leaks are not Ernie's, so leak checks are off). On pushes to
  # main and release tags, not pull requests, as it is the slowest job.
  sanitize:
    name: sanitize (part ${{ matrix.part }} of 4)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Every fourth test each, side by side, as the GCC tests run.
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    env:
      CC: clang
      CXX: clang++
      ERNIE_TEST_REQUIRE_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install Vulkan (lavapipe, validation layers)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build mesa-vulkan-drivers vulkan-validationlayers libvulkan1
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sanitize
      - uses: actions/cache@v6
        with:
          path: |
            .deps/*-src
            .deps/*-subbuild
          key: deps-${{ hashFiles('cmake/third_party/**') }}
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "-DFETCHCONTENT_BASE_DIR=$PWD/.deps"
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
          -DERNIE_BUILD_TESTS=ON -DERNIE_BUILD_PYTHON=OFF -DERNIE_BUILD_APP=OFF -DERNIE_INSTALL=OFF
      - name: Build
        run: cmake --build build --parallel "$(nproc)"
      - name: Compiler cache statistics
        if: always()
        run: ccache --print-stats > build/ccache-stats.tsv || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ninja-log-sanitize-${{ matrix.part }}
          path: |
            build/.ninja_log
            build/ccache-stats.tsv
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Test on lavapipe
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          VK_DRIVER_FILES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n1)
          export VK_DRIVER_FILES
          ctest --test-dir build --output-on-failure -j4 --timeout 1800 -I ${{ matrix.part }},,4

  # The release wheels (pyproject.toml, [tool.cibuildwheel]): manylinux_2_34 for x86_64 and
  # aarch64, Windows x86_64, and macOS on Apple silicon with MoltenVK bundled. The wheel-test job
  # renders with the Linux and Windows wheels on lavapipe; the macOS wheel is tested on the scene
  # API, as those runners have no Vulkan driver.
  wheel:
    name: wheel (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: windows-amd64
            runner: windows-2025
          - platform: macos-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Version
        shell: bash
        run: >
          perl -pi -e 's/set\(ERNIE_VERSION_SUFFIX ""/set(ERNIE_VERSION_SUFFIX "${{ needs.version.outputs.suffix }}"/'
          CMakeLists.txt
      # MSVC on the path for the workflow's Ninja generator: without it CMake finds the runner's
      # MinGW GCC (Strawberry Perl's) instead.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: pypa/cibuildwheel@v4.3.0
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}
          path: wheelhouse/*.whl

  # Each wheel installed on a plain runner and smoke tested on a software Vulkan driver: the
  # README's examples (import and render), the scene API and the bundled viewer. Linux uses
  # Ubuntu's lavapipe (AlmaLinux 9, the wheels' build image, has none for aarch64), and Windows
  # Mesa's lavapipe from mesa-dist-win with LunarG's Vulkan loader.
  wheel-test:
    name: wheel-test (${{ matrix.platform }})
    needs: wheel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: windows-amd64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    env:
      ERNIE_TEST_REQUIRE_VALIDATION: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.platform }}
          path: wheelhouse
      - name: Install Vulkan (lavapipe, validation layers)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers libvulkan1 xvfb
          VK_DRIVER_FILES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n1)
          echo "VK_DRIVER_FILES=$VK_DRIVER_FILES" >> "$GITHUB_ENV"
      - name: Install Vulkan (lavapipe, Vulkan loader)
        if: runner.os == 'Windows'
        # The loader alone, without the SDK's validation layers: the smoke test checks for a
        # device itself instead.
        run: |
          echo "ERNIE_TEST_REQUIRE_VALIDATION=0" >> "$GITHUB_ENV"
          .github/scripts/install-lavapipe-windows.sh
      - uses: astral-sh/setup-uv@v7
      - name: Install the wheel
        run: |
          uv venv --python 3.12
          uv pip install wheelhouse/*.whl pytest pillow
      - name: Smoke test
        run: |
          tests="ernie/test/python/test_readme.py ernie/test/python/test_scene.py ernie/test/python/test_app.py"
          if [ "$RUNNER_OS" = Windows ]; then
            # A device made and released first, which the next step
            # debugs if it fails.
            printf '%s\n' 'import ernie' 'print("imported", flush=True)' \
              'r = ernie.Renderer()' 'print("device", flush=True)' 'del r' \
              'print("released", flush=True)' > "$RUNNER_TEMP/device_check.py"
            .venv/Scripts/python -X faulthandler "$RUNNER_TEMP/device_check.py"
            .venv/Scripts/python -m pytest -q -p no:cacheprovider $tests
          else
            xvfb-run -a .venv/bin/python -m pytest -q -p no:cacheprovider $tests
          fi
      # The venv's python.exe only starts the base interpreter, so the
      # debugger runs that one, with the venv's packages.
      - name: Debug the device check
        if: failure() && runner.os == 'Windows'
        run: |
          python=$(.venv/Scripts/python -c "import sys; print(sys._base_executable)")
          packages=$(cygpath -w "$PWD/.venv/Lib/site-packages")
          PYTHONPATH="$packages" .github/scripts/debug-windows.sh \
            "$packages/ernie" "$(cygpath -u "$python")" \
            "$(cygpath -w "$RUNNER_TEMP/device_check.py")"

  sdist:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: >
          sed -i 's/set(ERNIE_VERSION_SUFFIX ""/set(ERNIE_VERSION_SUFFIX "${{ needs.version.outputs.suffix }}"/'
          CMakeLists.txt
      - uses: astral-sh/setup-uv@v7
      - name: Build and check the sdist
        run: |
          uv build --sdist --out-dir dist .
          uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # The documentation site, built strictly from the x86_64 wheel's package and stubs (unpacked where
  # a build puts them, as mkdocs.yml reads them) and the public headers. Pushes to main publish it
  # to GitHub Pages as "latest" (mike, on the gh-pages branch).
  docs:
    needs: wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: wheel-linux-x86_64
          path: wheelhouse
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Doxygen and the docs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          python -m pip install -r docs/requirements.txt
      - name: Unpack the Python package into build/python
        run: python -m zipfile -e wheelhouse/*.whl build/python
      - name: Build
        run: mkdocs build
      - name: Publish latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mike deploy --push latest
          mike set-default --push latest

  # The DEB, RPM and TGZ packages (one `ernie` package each), built in manylinux_2_34 (AlmaLinux 9,
  # glibc 2.34) so they install on Ubuntu 22.04+, Debian 12+ and RHEL 9+: the oldest base Slang's
  # prebuilt library runs on (GCC 11's libstdc++, GLIBCXX_3.4.29).
  packages:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: >
          sed -i 's/set(ERNIE_VERSION_SUFFIX ""/set(ERNIE_VERSION_SUFFIX "${{ needs.version.outputs.suffix }}"/'
          CMakeLists.txt
      - name: Install the build's packages
        run: |
          dnf install -y -q --enablerepo=crb libX11-devel libXrandr-devel libXinerama-devel \
            libXcursor-devel libXi-devel libXext-devel wayland-devel wayland-protocols-devel \
            libxkbcommon-devel libcurl-devel rpm-build
          dnf install -y -q epel-release
          dnf install -y -q ccache
          command -v ninja >/dev/null || pipx install -q ninja
      # The DEB and RPM builds differ only in where libraries install (lib, lib64): through ccache,
      # the RPM build reuses every object the DEB build compiled, and later runs start warm.
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: packages-ccache-${{ github.sha }}
          restore-keys: packages-ccache-
      - name: Build the packages
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          export CCACHE_DIR="$PWD/.ccache" CCACHE_MAXSIZE=2G
          ccache --zero-stats
          for kind in deb rpm; do
            cmake --preset package-$kind
            cmake --build --preset package-$kind -j "$(nproc)"
            cpack --preset package-$kind
          done
          ccache --show-stats
          # rpmbuild finds the libraries the binaries link, libcurl
          # among them.
          rpm -qpR build/package-rpm/packages/*.rpm | grep -F libcurl.so
          mkdir packages
          cp build/package-deb/packages/*.deb build/package-deb/packages/*.tar.gz \
            build/package-rpm/packages/*.rpm packages/
      - uses: actions/upload-artifact@v7
        with:
          name: packages-linux-x86_64
          path: packages/*

  # The packages installed on clean systems and used as an application would: the viewer runs, and
  # an application built with find_package(Ernie) renders on lavapipe.
  package-test:
    name: package-test (${{ matrix.image }})
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ${{ matrix.image }}
    # The clean systems have Make, not the workflow's Ninja.
    env:
      CMAKE_GENERATOR: Unix Makefiles
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            install: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq
            packages: ./packages/*.deb
            tools: mesa-vulkan-drivers cmake g++ make
          - image: ubuntu:24.04
            install: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq
            packages: ./packages/*.deb
            tools: mesa-vulkan-drivers cmake g++ make
          - image: debian:12
            install: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq
            packages: ./packages/*.deb
            tools: mesa-vulkan-drivers cmake g++ make
          - image: rockylinux:9
            install: dnf install -y -q
            packages: ./packages/*.rpm
            tools: mesa-vulkan-drivers cmake gcc-c++ make
          - image: fedora:latest
            install: dnf install -y -q
            packages: ./packages/*.rpm
            tools: mesa-vulkan-drivers cmake gcc-c++ make
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages-linux-x86_64
          path: packages
      # Ernie's packages alone first, so the program runs on what they
      # pull in themselves (the build tools bring libcurl, for one).
      - name: Install the packages
        run: ${{ matrix.install }} ${{ matrix.packages }}
      - name: Run the viewer
        run: |
          if ldd "$(command -v ernie)" | grep "not found"; then
            exit 1
          fi
          ernie --version
      - name: Install the build tools
        run: ${{ matrix.install }} ${{ matrix.tools }}
      - name: Build and run an application against them
        run: |
          cmake -S ernie/test/install -B consumer -DCMAKE_BUILD_TYPE=Release
          cmake --build consumer
          VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1) consumer/consumer

  # The ernie program in a Docker image (docker/Dockerfile), from the DEB the package tests
  # installed: smoke tested by rendering the default scene on lavapipe, then pushed to GitHub's
  # container registry as ghcr.io/alexmaietta/ernie, dev from main and X.Y.Z and latest from
  # release tags. Pull requests build and test it only.
  docker:
    needs: [packages, package-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages-linux-x86_64
          path: docker-context
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: docker/Dockerfile
          load: true
          tags: ernie:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm ernie:test --version
          docker run --rm -v "$PWD:/out" ernie:test --viewer null --output /out/scene.png
          test -s scene.png
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push' && steps.meta.outputs.tags != ''
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # The wheels and sdist to PyPI as ernie-renderer once the tests pass on every platform (Linux,
  # Windows and macOS builds, and every wheel): X.Y.Z.devN from pushes to
  # main (pip installs them only with --pre), X.Y.Z from release tags. Trusted Publishing: PyPI
  # trusts ci.yml's jobs in the pypi environment (main and v* tags only), so no token is stored.
  publish:
    needs: [test, wheel, wheel-test, sdist]
    timeout-minutes: 10
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/ernie-renderer/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
