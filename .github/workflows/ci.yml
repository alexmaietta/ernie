name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The version's pre-release suffix: .devN on main (N commits since the last release tag), none on
  # release tags (which must match CMakeLists.txt) or pull requests.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suffix: ${{ steps.version.outputs.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        run: |
          project=$(grep -m 1 -oP '^\s*VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          suffix=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$project" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match CMakeLists.txt's version $project"
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null); then
              suffix=".dev$(git rev-list --count "$last..HEAD")"
            else
              suffix=".dev$(git rev-list --count HEAD)"
            fi
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "Version $project$suffix"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  build:
    name: build (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install nanobind ninja
      # MSVC on the path for the Ninja generator.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
      # Fetched dependencies' sources (ERNIE_DEPS_DIR), keyed on their pins; they are built in the
      # build tree, so compiled objects are not cached.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/ErnieFetch.cmake', 'cmake/third_party/**') }}
      - name: Configure
        shell: bash
        run: >
          cmake --preset ci
          "-DERNIE_VERSION_SUFFIX=${{ needs.version.outputs.suffix }}"
          "-DPython_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')"
          -DERNIE_TEST_PYTHON=python
      - name: Build
        run: cmake --build --preset ci --parallel 4
      # The installed library used as end users use it: its headers compile alone and a program
      # links and runs against it (QA-072). Windows finds ernie.dll on the PATH.
      - name: Install and build a consumer
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/ernie"
          cmake --install build/ci --prefix "$prefix" --component runtime
          cmake --install build/ci --prefix "$prefix" --component dev
          cmake -S tests/consumer -B build/consumer -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$prefix"
          cmake --build build/consumer
          PATH="$prefix/bin:$PATH" ctest --test-dir build/consumer --output-on-failure
      # The build tree without objects, for this platform's test job; tar keeps file modes.
      - name: Pack the build tree
        shell: bash
        run: tar --exclude='*.o' --exclude='*.obj' -cf build-ci.tar build/ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.os }}
          path: build-ci.tar
          retention-days: 3

  # Tests on Mesa's lavapipe, the software Vulkan driver, on every platform.
  test:
    name: test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    env:
      ERNIE_TEST_REQUIRE_VULKAN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.os }}
      - name: Unpack the build tree
        shell: bash
        run: tar -xf build-ci.tar
      - name: Install lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n1)
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Install lavapipe
        if: runner.os == 'Windows'
        shell: bash
        run: .github/scripts/install-lavapipe-windows.sh
      - name: Install lavapipe
        if: runner.os == 'macOS'
        run: |
          brew install mesa vulkan-loader
          prefix=$(brew --prefix)
          icd=$(find "$prefix/share/vulkan/icd.d" -name 'lvp_icd*.json' | head -n1)
          {
            echo "VK_DRIVER_FILES=$icd"
            echo "VK_ICD_FILENAMES=$icd"
            echo "DYLD_FALLBACK_LIBRARY_PATH=$prefix/lib"
          } >> "$GITHUB_ENV"
      - name: Test
        run: ctest --preset ci -j4

  # Line and branch coverage of the C++ library from every test on Linux and lavapipe.
  coverage:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ERNIE_TEST_REQUIRE_VULKAN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install nanobind ninja pytest gcovr
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/ErnieFetch.cmake', 'cmake/third_party/**') }}
      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n1)
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake --preset coverage
          "-DPython_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')"
          -DERNIE_TEST_PYTHON=python
      - name: Build
        run: cmake --build --preset coverage --parallel 4
      - name: Test
        run: ctest --preset coverage -j4
      - name: Report
        run: |
          mkdir -p coverage
          gcovr --root . --filter 'ernie/' --exclude '.*_table\.h' \
            --object-directory build/coverage \
            --html-details coverage/index.html --json-summary coverage/summary.json --print-summary
          python .github/scripts/coverage_badge.py coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          retention-days: 14

  # The documentation, built strictly so broken links and warnings fail.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: site
          retention-days: 14

  # The project site on GitHub Pages, from main: the docs, with the coverage report and its badge
  # under coverage/.
  # The site follows main whenever its docs build, so a failing test elsewhere never takes it down;
  # the coverage report is included when the coverage job passed.
  pages:
    needs: [docs, coverage]
    if: >
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.docs.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.coverage.result == 'success'
        with:
          name: coverage
          path: site/coverage
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  wheel:
    name: wheel (${{ matrix.platform }}, ${{ matrix.python }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # cp312 is the stable-ABI wheel for every CPython from 3.12.
        python: [cp310, cp311, cp312]
        platform: [linux-x86_64, linux-aarch64, windows-amd64, macos-arm64]
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: windows-amd64, runner: windows-2025 }
          - { platform: macos-arm64, runner: macos-15 }
    env:
      CIBW_BUILD: ${{ matrix.python }}-*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        shell: bash
        run: >
          sed -i.bak 's/set(ERNIE_VERSION_SUFFIX ""/set(ERNIE_VERSION_SUFFIX "${{ needs.version.outputs.suffix }}"/'
          CMakeLists.txt
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.platform }}-${{ matrix.python }}
          path: wheelhouse/*.whl

  # The sdist, then a wheel built from it and imported, as pip does for platforms without wheels.
  sdist:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Version
        run: >
          sed -i 's/set(ERNIE_VERSION_SUFFIX ""/set(ERNIE_VERSION_SUFFIX "${{ needs.version.outputs.suffix }}"/'
          CMakeLists.txt
      - run: python -m pip install build
      - run: python -m build --sdist
      - name: Install from the sdist
        run: |
          python -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP" && python -c "import ernie; print(ernie.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  # DEB, RPM and TGZ of the ernie program, built on manylinux_2_34 so they run on glibc 2.34 or later.
  packages:
    name: packages (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    container: quay.io/pypa/manylinux_2_34_${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        run: >
          sed -i 's/set(ERNIE_VERSION_SUFFIX ""/set(ERNIE_VERSION_SUFFIX "${{ needs.version.outputs.suffix }}"/'
          CMakeLists.txt
      - name: Build tools
        run: |
          dnf install -y -q rpm-build
          command -v ninja >/dev/null || pipx install -q ninja
      # One build; each format installs the library where its distributions look for it, as the
      # build image (RHEL's lib64) is not where Debian and Ubuntu look.
      - name: Build
        run: |
          cmake --preset package
          cmake --build --preset package --parallel 4
          cd build/package
          cmake -DCMAKE_INSTALL_LIBDIR=lib/$(uname -m)-linux-gnu . && cpack -G DEB
          cmake -DCMAKE_INSTALL_LIBDIR=lib64 . && cpack -G RPM
          cmake -DCMAKE_INSTALL_LIBDIR=lib . && cpack -G TGZ
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-linux-${{ matrix.arch }}
          path: |
            build/package/packages/*.deb
            build/package/packages/*.rpm
            build/package/packages/*.tar.gz

  # Each package installed on a clean distribution, where the program must find lavapipe.
  package-test:
    name: package-test (${{ matrix.image }}, ${{ matrix.arch }})
    needs: packages
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "rockylinux/rockylinux:9"]
    container: ${{ matrix.image }}
    steps:
      # The consumer project; checked out first, as checkout clears the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-linux-${{ matrix.arch }}
      - name: Install
        if: ${{ !startsWith(matrix.image, 'rockylinux') }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ./*.deb mesa-vulkan-drivers cmake g++ make
      - name: Install
        if: ${{ startsWith(matrix.image, 'rockylinux') }}
        run: dnf install -y ./*.rpm cmake gcc-c++ make
      # The -dev package used as end users use it, with the distribution's own compiler and CMake.
      - name: Build a consumer
        run: |
          cmake -S tests/consumer -B /tmp/consumer -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/consumer
          ctest --test-dir /tmp/consumer --output-on-failure
      # Rocky 9 has no lavapipe for aarch64, so there the program is only run, not given a device.
      - name: Install lavapipe
        if: ${{ startsWith(matrix.image, 'rockylinux') && matrix.arch == 'x86_64' }}
        run: dnf install -y mesa-vulkan-drivers
      - name: Run
        run: ernie --version
      - name: List devices
        if: ${{ !(startsWith(matrix.image, 'rockylinux') && matrix.arch == 'aarch64') }}
        run: ernie --devices | grep -i llvmpipe

  # The ernie program's image, built from source; pushed to GHCR from main (dev) and release tags.
  docker:
    needs: [version, lint, test, package-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t ernie:test .
      - name: Smoke test
        run: |
          docker run --rm ernie:test --version
          docker run --rm ernie:test --devices | grep -i llvmpipe
      - name: Push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            tags=("$version" "${version%.*}" latest)
          else
            tags=(dev)
          fi
          for tag in "${tags[@]}"; do
            docker tag ernie:test "$image:$tag"
            docker push "$image:$tag"
          done

  # Wheels and the sdist to PyPI by Trusted Publishing (no stored token): X.Y.Z.devN from main,
  # X.Y.Z from release tags, once every platform's build, tests and packages pass.
  pypi:
    needs: [lint, test, wheel, sdist, package-test]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/ernie-renderer/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # A GitHub release for each v* tag, with every wheel, the sdist, the packages and their checksums.
  release:
    needs: [lint, test, wheel, sdist, package-test, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "wheel-*"
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "sdist"
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "packages-*"
          merge-multiple: true
          path: assets
      - name: Checksums
        run: cd assets && sha256sum -- * > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" assets/*
          --repo "$GITHUB_REPOSITORY" --title "Ernie ${GITHUB_REF_NAME#v}" --generate-notes
