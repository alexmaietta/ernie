name: Coverage

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
      LP_NUM_THREADS: "1"
      ERNIE_TEST_REQUIRE_DEVICE: "1"
      ERNIE_TEST_FULL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install gcovr nanobind numpy pytest pytest-cov
      - name: Install Ninja, ccache and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache mesa-vulkan-drivers libvulkan1
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n1)
          {
            echo "VK_DRIVER_FILES=$icd"
            echo "VK_ICD_FILENAMES=$icd"
          } >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-coverage-${{ github.sha }}
          restore-keys: ccache-coverage-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ernie
          key: kernels-coverage-${{ github.sha }}
          restore-keys: kernels-coverage-
      - name: Configure
        run: >
          cmake --preset coverage
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "-DPython_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')"
      - name: Build
        run: |
          ccache --zero-stats
          cmake --build --preset coverage --parallel 4
          ccache --show-stats
      - name: Test
        run: ctest --preset coverage -j4
      - name: Report
        run: |
          mkdir -p coverage
          gcovr --root . --filter 'ernie/' --object-directory build-coverage \
            --exclude-unreachable-branches --exclude-throw-branches \
            --html-details coverage/index.html --json-summary coverage/summary.json \
            --cobertura coverage/cobertura.xml --print-summary
          gcovr --root . --filter 'ernie/[^/]+/kernels/' --object-directory build-coverage \
            --exclude-unreachable-branches --exclude-throw-branches \
            --json-summary coverage/kernel-summary.json
          cp build-coverage/python-coverage.xml coverage/
      - name: Summary
        shell: python
        run: |
          import json, os
          import xml.etree.ElementTree as tree

          summary = json.load(open("coverage/summary.json"))
          kernels = json.load(open("coverage/kernel-summary.json"))
          python = float(tree.parse("build-coverage/python-coverage.xml").getroot().get("line-rate"))

          def badge(name, label, percent):
              color = next(c for limit, c in [(90, "brightgreen"), (75, "green"), (60, "yellow"),
                                              (40, "orange"), (0, "red")] if percent >= limit)
              json.dump({"schemaVersion": 1, "label": label, "message": f"{percent:.0f}%",
                         "color": color}, open(f"coverage/{name}", "w"))

          badge("badge.json", "coverage", summary["line_percent"])
          badge("kernel-badge.json", "kernel coverage", kernels["line_percent"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### Coverage\n\n"
                        f"- C++ lines: {summary['line_percent']:.1f}%\n"
                        f"- C++ branches: {summary['branch_percent']:.1f}%\n"
                        f"- C++ functions: {summary['function_percent']:.1f}%\n"
                        f"- Kernel lines: {kernels['line_percent']:.1f}%\n"
                        f"- Python lines: {python * 100:.1f}%\n")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          retention-days: 14
