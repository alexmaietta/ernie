name: Version

on:
  workflow_call:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag
        run: |
          project=$(grep -m 1 -oP '^\s*VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          prerelease=$(grep -m 1 -oP '^set\(ERNIE_PRERELEASE "\K[^"]*' CMakeLists.txt)
          if [[ -n "$prerelease" && ! "$prerelease" =~ ^(a|b|rc)[0-9]+$ ]]; then
            echo "::error::ERNIE_PRERELEASE is $prerelease, which is not a1, b1, rc1 or empty"
            exit 1
          fi
          version=$project$prerelease
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CMakeLists.txt's version $version"
            exit 1
          fi
          echo "Version $version"
