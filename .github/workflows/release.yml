name: Release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: assets
      - name: Flatten the archive directories
        run: |
          find assets -mindepth 2 -type f -exec mv -t assets {} +
          find assets -mindepth 1 -type d -empty -delete
      - name: Checksums
        run: cd assets && sha256sum -- * > SHA256SUMS
      - name: Release
        run: >
          gh release create "$GITHUB_REF_NAME" assets/*
          --title "Ernie ${GITHUB_REF_NAME#v}" --generate-notes
