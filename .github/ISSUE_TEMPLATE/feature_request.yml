name: Feature request
description: A sensor, effect, prim type or API Ernie should have.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you're trying to do
      description: The simulation or workflow, and what's missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could look in the scene or API. For physical models, link the papers or instrument specs.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you've tried, or how other renderers do it.
