[build-system]
requires = ["scikit-build-core>=1.1", "nanobind>=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "ernie-renderer"
dynamic = ["version"]
description = "Efficient Renderer for Natural and Interplanetary Environments: a physically based, spectral Vulkan ray tracer"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Alex Maietta" }]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/alexmaietta/ernie"
Repository = "https://github.com/alexmaietta/ernie"
Issues = "https://github.com/alexmaietta/ernie/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.21"
cmake.build-type = "Release"
build-dir = "build/wheel/{wheel_tag}"
# Stable-ABI (abi3) wheels from 3.12, where nanobind supports it; ordinary per-version wheels below.
wheel.py-api = "cp312"
wheel.packages = []
install.components = ["python"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = '''(?s)project\(\s*Ernie\s+VERSION\s+(?P<value>[0-9]+\.[0-9]+\.[0-9]+).*?set\(ERNIE_VERSION_SUFFIX\s+"(?P<suffix>[^"]*)"'''
result = "{value}{suffix}"

[tool.scikit-build.cmake.define]
ERNIE_BUILD_PYTHON = "ON"
ERNIE_BUILD_TESTS = "OFF"
ERNIE_BUILD_APP = "OFF"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", ".deps", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ernie"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.cibuildwheel]
# Per-version wheels for 3.10 and 3.11; one stable-ABI wheel serves every CPython from 3.12. CI
# builds each in its own job (CIBW_BUILD).
build = "cp310-* cp311-* cp312-*"
skip = "*-musllinux_*"
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"
test-command = "python -c \"import ernie; print(ernie.__version__)\""

[tool.cibuildwheel.linux]
# Slang's runtime is in the wheel already, beside the module, with the glslang library it loads by
# name at run time; auditwheel would rename the compiler and strand that library.
repair-wheel-command = "auditwheel repair --exclude 'libslang-*' -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64"]
# Slang's prebuilt runtime targets macOS 26.
environment = { MACOSX_DEPLOYMENT_TARGET = "26.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
