[build-system]
requires = ["scikit-build-core>=1.1", "nanobind>=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "ernie-renderer"
dynamic = ["version"]
description = "Efficient Renderer for Natural and Interplanetary Environments: a physically-based, real-time, spectral renderer for planetary robotics and sensing"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Alex Maietta" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]
viewer = ["ernie-renderer-viewer"]

[project.urls]
Homepage = "https://github.com/alexmaietta/ernie"
Documentation = "https://alexmaietta.github.io/ernie/"
Repository = "https://github.com/alexmaietta/ernie"
Issues = "https://github.com/alexmaietta/ernie/issues"

[project.scripts]
ernie = "ernie.__main__:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
cmake.build-type = "Release"
build-dir = "build-wheel/ernie"
wheel.py-api = "cp312"
wheel.packages = []
build.targets = ["_ernie", "ernie_python_stubs_ernie"]
install.components = ["python"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = '''project\(\s*Ernie\s+VERSION\s+(?P<value>[0-9]+\.[0-9]+\.[0-9]+)'''

[tool.scikit-build.cmake.define]
ERNIE_BUILD_PYTHON = "ON"
ERNIE_BUILD_VIEWER = "OFF"
ERNIE_BUILD_TESTS = "OFF"
ERNIE_INSTALL = "ON"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"
skip = "*-musllinux_*"
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"
test-command = "python -c \"import ernie; print(ernie.__version__)\""

[tool.cibuildwheel.linux]
repair-wheel-command = "auditwheel repair --exclude 'libslang-*' -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "26.0" }

[tool.cibuildwheel.windows]
archs = ["native"]
repair-wheel-command = "delvewheel repair --no-dll \"ernie.dll;slang-compiler.dll;slang-glslang.dll;msvcp140.dll\" -w {dest_dir} {wheel}"
